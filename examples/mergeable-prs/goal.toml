goal_file = "GOAL.md"
interval_seconds = 0
max_wait_seconds = 300
worker_observation = "none"

[sensor]
command = ["python3", "./sensor.py"]
timeout_seconds = 180

# The decider receives only the generated prompt. Its sole tool is needed to
# publish result.json; the injected contract forbids every other modification.
[decider]
command = [
  "./goal-runner-pi",
  "--model", "openai-codex/gpt-5.6-sol",
  "--thinking", "medium",
  "--tools", "write",
  "--", "{prompt}",
]
timeout_seconds = 300

# The disposable worker is non-interactive and receives only standard coding
# tools. It must return failure instead of requesting human input or approval.
[worker]
command = [
  "./goal-runner-pi",
  "--model", "openai-codex/gpt-5.6-sol",
  "--thinking", "medium",
  "--tools", "read,bash,edit,write,grep,find,ls",
  "--", "{prompt}",
]
timeout_seconds = 1800
