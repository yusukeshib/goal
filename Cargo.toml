[package]
name = "goal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A foreground controller for continuously pursuing one natural-language goal"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = { version = "3.4", features = ["termination"] }
fs2 = "0.4"
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3.15"
